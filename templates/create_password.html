<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Praamid Tracker</title><style>:root{--bg:#f4f7fb;--text:#172033;--muted:#667085;--line:#e4e7ec;--blue:#1769e0;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,rgba(23,105,224,.08),transparent 32rem),var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}.wrap{width:min(440px,calc(100% - 28px));margin:7vh auto}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 14px 36px rgba(31,50,78,.07)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:25px}.logo{width:44px;height:44px;border-radius:13px;background:var(--blue);display:grid;place-items:center;color:#fff;font-size:23px}.title{font-size:22px;font-weight:780}.sub{font-size:13px;color:var(--muted);margin-top:2px}h2{margin:0 0 6px}.muted{color:var(--muted);line-height:1.5}label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}input{width:100%;height:48px;border:1px solid #d8e0ea;border-radius:13px;padding:0 13px;font:inherit}.btn{width:100%;height:46px;margin-top:20px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:730;font:inherit}.flash{padding:11px 13px;border-radius:11px;margin:12px 0}.error{background:#fff1f0;color:var(--red)}.success{background:#edf9f3;color:#147a4b}a{color:var(--blue)}</style></head><body><main class="wrap"><section class="card"><div class="brand"><div class="logo">⛴</div><div><div class="title">Praamid Tracker</div><div class="sub">Ferry availability alerts</div></div></div><h2>Create password</h2><p class="muted">Use at least 8 characters.</p>{% for c,m in get_flashed_messages(with_categories=true) %}<div class="flash {{c}}">{{m}}</div>{% endfor %}<form method="post"><label>Password</label><input type="password" name="password" minlength="8" required><label>Confirm password</label><input type="password" name="confirm_password" minlength="8" required><button class="btn">Create account</button></form></section></main></body></html>
