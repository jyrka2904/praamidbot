<!doctype html>
<html lang="{{ lang }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ t.app_name }}</title>
<style>
:root{--blue:#1267e8;--navy:#13233f;--muted:#6f7f98;--line:#e2eaf4;--bg:#f4f8fd}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fbff,#f2f7fd);color:var(--navy);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.shell{width:min(440px,calc(100% - 28px));margin:7vh auto}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 18px 50px rgba(40,73,115,.09)}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:26px}.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,#2d83f6,#075de0);display:grid;place-items:center;color:#fff;font-size:24px}
.title{font-size:22px;font-weight:820}.tag{color:var(--muted);font-size:13px;margin-top:3px}h2{margin:0 0 6px}.sub{color:var(--muted);margin:0 0 22px;line-height:1.45}
label{display:block;font-weight:750;font-size:13px;margin:0 0 7px}input{width:100%;height:48px;border:1px solid #d9e4f1;border-radius:12px;padding:0 13px;font:inherit;outline:none}input:focus{border-color:#6da8f2;box-shadow:0 0 0 4px rgba(18,103,232,.09)}
button{width:100%;height:48px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-weight:800;cursor:pointer}.flash{padding:11px 13px;border-radius:11px;margin-bottom:14px;font-size:13px}.flash.error{background:#fff1f1;color:#a73539}.flash.success{background:#edf9f3;color:#19734e}
.bottom{text-align:center;color:var(--muted);font-size:13px;margin:20px 0 0}.bottom a{color:var(--blue);font-weight:750}.langs{display:flex;justify-content:flex-end;gap:4px;margin-bottom:17px}.langs a{padding:6px 9px;border-radius:8px;text-decoration:none;color:#6b7b92;font-size:12px;font-weight:850}.langs a.on{background:#eaf3ff;color:var(--blue)}
</style>
</head>
<body><main class="shell"><section class="card">
<div class="langs">
<a class="{% if lang=='et' %}on{% endif %}" href="{{ url_for('set_language', lang='et', next=request.path) }}">ET</a>
<a class="{% if lang=='en' %}on{% endif %}" href="{{ url_for('set_language', lang='en', next=request.path) }}">EN</a>
</div>
<div class="brand"><div class="logo">⛴</div><div><div class="title">{{ t.app_name }}</div><div class="tag">{{ t.tagline }}</div></div></div>
{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{category}}">{{message}}</div>{% endfor %}

<h2>{{ t.password_title }}</h2>
<p class="sub">{{ t.password_subtitle }}</p>
<form method="post">
<label>{{ t.password }}</label><input type="password" name="password" minlength="8" required><br><br>
<label>{{ t.confirm_password }}</label><input type="password" name="confirm_password" minlength="8" required><br><br>
<button>{{ t.create_account }}</button>
</form>

</section></main></body></html>
