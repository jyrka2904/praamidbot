<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Praamid Tracker</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#e4e7ec;--blue:#1769e0;--soft:#eef5ff;--danger:#b42318;--success:#147a4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.shell{width:min(920px,calc(100% - 24px));margin:auto;padding:28px 0 60px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:18px}
h1,h2{margin-top:0}.sub{color:var(--muted)}input,select{width:100%;min-height:44px;border:1px solid var(--border);border-radius:11px;background:#fff;padding:0 12px;font:inherit}
label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:0 0 6px}button,.btn{border:0;border-radius:11px;min-height:42px;padding:0 14px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.primary{background:var(--blue);color:white}.primary:disabled{opacity:.45;cursor:not-allowed}.ghost{background:#f2f4f7;color:var(--text)}.danger{background:#fff1f0;color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.tracker{padding:16px 0;border-top:1px solid var(--border)}.tracker:first-child{border-top:0}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:12px;font-weight:700}.flash{padding:11px 13px;border-radius:11px;margin-bottom:12px}.flash.success{background:#edf9f3;color:var(--success)}.flash.error{background:#fff1f0;color:var(--danger)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.limit{font-size:13px;color:var(--muted);margin-bottom:14px}
@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}.row{align-items:flex-start}}@media(max-width:480px){.grid{grid-template-columns:1fr}.row{flex-direction:column}.actions{width:100%}.actions form{flex:1}.actions button{width:100%}}
</style>
</head>
<body><main class="shell" style="max-width:420px"><div class="card">
<h1>⛴️ Praamid Tracker</h1><p class="sub">Log in to manage your ferry availability alerts.</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}
<form method="post"><label>Phone number</label><input name="phone_number" placeholder="+37255512345" required><br><br><label>Password</label><input name="password" type="password" required><br><br><button class="primary" style="width:100%" type="submit">Log in</button></form>
<p class="sub">No account? <a href="/signup">Create one</a></p>
</div></main></body></html>
