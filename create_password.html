<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--blue:#1f6feb;--green:#157347;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.wrap{max-width:900px;margin:auto;padding:28px 14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}
h1,h2{margin-top:0}.muted{color:var(--muted)}label{display:block;font-weight:650;font-size:14px;margin-bottom:6px}
input,select{width:100%;height:46px;border:1px solid var(--line);border-radius:11px;padding:0 12px;font:inherit;background:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.btn,button{border:0;border-radius:11px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.ghost{background:#eef2f6}.danger{background:#fff1f0;color:var(--red)}
.row{display:flex;justify-content:space-between;gap:15px;align-items:center}.tracker{border-top:1px solid var(--line);padding:16px 0}.tracker:first-of-type{border-top:0}
.flash{padding:10px 12px;border-radius:10px;margin-bottom:12px}.success{background:#edf8f2;color:var(--green)}.error{background:#fff1f0;color:var(--red)}
.badge{display:inline-block;background:#eef5ff;color:var(--blue);padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.actions{display:flex;gap:7px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.row{align-items:flex-start}.tracker.row{flex-direction:column}.actions{width:100%}}
</style><main class="wrap" style="max-width:440px"><div class="card"><h1>Create password</h1>{% for c,m in get_flashed_messages(with_categories=true) %}<div class="flash {{c}}">{{m}}</div>{% endfor %}<form method="post"><label>Password</label><input type="password" name="password" minlength="8" required><br><br><label>Confirm password</label><input type="password" name="confirm_password" minlength="8" required><br><br><button class="primary" style="width:100%">Create account</button></form></div></main>
